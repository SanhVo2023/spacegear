  - name: legal
    label: Legal pages
    icon: gavel
    description: The preview notice and the contact section are added by the site from its settings.
    files:
      - name: privacy
        label: Privacy
        file: content/legal/privacy.md
        fields:
          # A plain text area: the markdown and rich-text widgets write \ escapes, which the legal
          # parser (src/lib/legal-markdown.ts) refuses. The pattern mirrors the parser: a "## "
          # heading first, and none of its INLINE_SYNTAX anywhere (tests/cms-config.test.mjs).
          - &legal_body { name: body, label: Sections, widget: text, hint: "Start each section with a line '## Heading', then plain paragraphs separated by blank lines. Leave a blank line before each heading. No other formatting.", pattern: ['^(?![\s\S]*(?:[*_`<>[\]\\|]|~~|&#?\w+;))##[ \t]+\S', 'Start with a line "## Heading", then plain paragraphs, without * _ ` < > [ ] \ | ~~ or &…; characters'], use_emoji_autocomplete: false }
      - name: terms
        label: Website terms
        file: content/legal/terms.md
        fields:
          - *legal_body
