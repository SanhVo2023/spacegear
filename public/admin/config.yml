# Sveltia CMS configuration for spacegear.tech, served at /admin/config.yml.
#
# On the live site: open https://spacegear.tech/admin/ and choose "Sign In with GitHub". Every save is
# a commit to the main branch of the repository below, and that commit rebuilds and deploys the site
# (Cloudflare Workers Builds). Only GitHub accounts with push access to the repository can save.
# Locally: build and start the preview, open /admin/ on it (http://127.0.0.1:<port>/admin/) in Chrome
# or Edge, choose "Work with Local Repository" and pick the repository folder. Saves write straight
# into content/ and public/uploads/; rebuild to see them on the preview. See README.md, "Editing
# content". Written for Sveltia CMS 0.230.1 (public/admin/sveltia/, scripts/vendor-sveltia.mjs).
#
# Every field mirrors a rule in src/lib/content-model.ts (names, order, required, lengths, options,
# list sizes); tests/cms-config.test.mjs fails when the two drift apart. The build validates every
# file again and runs the honesty checks (no prices, invented metrics, clients or offices).
# Emoji autocomplete is off in every text input (use_emoji_autocomplete: false on each string and
# text field; Sveltia has no global switch for it).

backend:
  name: github
  # The site's repository and its production branch. The local workflow never contacts it.
  repo: SanhVo2023/spacegear
  branch: main
  # Sign-in runs on this site's own Worker (worker/github-auth.ts): the CMS opens
  # https://spacegear.tech/api/auth in a popup, and the Worker chooses the GitHub scope
  # (public_repo). No auth_type: Sveltia 0.230.1 refuses PKCE with GitHub (github_pkce_unsupported).
  # README.md, "Editing from GitHub", has the setup.
  base_url: https://spacegear.tech
  auth_endpoint: api/auth

app_title: spacegear.tech content
logo:
  src: /icon.svg
show_preview_links: false
editor:
  preview: false

media_folder: public/uploads
public_folder: /uploads
media_libraries:
  default:
    config:
      max_file_size: 10485760
      # File names follow the slug rules below: lowercase ASCII letters, digits, - and _, so
      # "Ảnh đẹp.JPG" is saved as anh-dep.webp. A name that is taken gets -1, -2…; check-content
      # asks for a rename if a name still does not fit (a ~, or the dotless ı of a Turkish browser).
      slugify_filename: true
      # Chrome re-encodes JPEG, PNG, AVIF and HEIC uploads as WebP through a canvas, which drops
      # camera metadata (GPS). GIF and WebP are kept as they are, so an animation keeps playing;
      # check-content refuses any upload that still carries location data. HEIC needs a decoder
      # that the CMS would load from unpkg.com, which the admin CSP blocks, so HEIC uploads are
      # refused at upload time instead of being saved as .heic.
      transformations:
        jpeg: &to_webp { format: webp, quality: 85, width: 2560, height: 2560 }
        png: *to_webp
        avif: *to_webp
        heic: *to_webp
  stock_assets: false

# The images that shipped before the CMS stay where they are; pick them here or type their path.
asset_collections:
  - name: site-images
    label: Site images (read only)
    media_folder: public/images
    public_folder: /images
    readonly: true

# Entry file names and upload names. Sveltia keeps "~" in ASCII slugs, and lowercases with the
# browser's language (a Turkish browser turns I into ı): the build refuses both, with a rename hint.
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"
  trim: true
  lowercase: true
  maxlength: 60

output:
  json:
    indent_style: space
    indent_size: 2

# Two languages (bilingual spec, Part 2). English files stay where they are; Vietnamese files mirror them under
# content/vi/: every path holds {{locale}}, and omit_default_locale_from_file_path leaves English's folder out
# (Sveltia 0.230.1 replaces "{{locale}}/" with nothing for the default locale). Every field says how it behaves
# in Vietnamese: i18n: true (translated) or i18n: duplicate (copied from English and read-only there: links,
# images, numbers, choices, patterned counts and the order). Both languages are saved for every entry.
# tests/cms-config.test.mjs checks every field; scripts/check-content.mjs refuses a Vietnamese file that differs
# from English other than in its text.
i18n:
  structure: multiple_folders
  locales: [en, vi]
  default_locale: en
  omit_default_locale_from_file_path: true

collections:
  - name: pages
    label: Site and sections
    label_singular: Block
    icon: web
    description: One file per block of the site. Counts such as 5/5 or 01/03 must match the services and engagements. Write the Vietnamese version in the right-hand pane; links, images, numbers and the order are copied from English.
    i18n: true
    files:
      - name: site
        label: Site identity
        file: content/{{locale}}/site.json
        i18n: true
        fields:
          - { name: name, label: Site name, widget: string, maxlength: 40, i18n: true, use_emoji_autocomplete: false }
          - { name: description, label: Default description, widget: text, maxlength: 200, i18n: true, use_emoji_autocomplete: false }
          - name: socialProfiles
            label: Social profiles
            widget: list
            i18n: duplicate
            required: false
            max: 8
            field: { name: url, label: Profile address, widget: string, maxlength: 200, i18n: duplicate, pattern: ['^https:\/\/\S+$', "Use a full https:// profile address"], use_emoji_autocomplete: false }
          - name: address
            label: Address
            hint: "Exactly as on the Google Business Profile (docs/operations/google-business-profile.md). The honesty check allows the address and the phone number only here."
            widget: object
            i18n: true
            fields:
              - { name: full, label: Full address (shown on the site), widget: string, maxlength: 120, i18n: true, use_emoji_autocomplete: false }
              - { name: street, label: Street line (structured data), widget: string, maxlength: 80, i18n: true, hint: "The start of the full address, up to the ward.", use_emoji_autocomplete: false }
              - { name: locality, label: City (structured data), widget: string, maxlength: 40, i18n: true, use_emoji_autocomplete: false }
          - { name: telephone, label: Telephone, widget: string, maxlength: 12, i18n: duplicate, hint: "International format with no spaces: +84386749799. The site shows 0386 749 799 in Vietnamese and +84 386 749 799 in English.", pattern: ['^\+84\d{9}$', "Use the international format with no spaces, such as +84386749799"], use_emoji_autocomplete: false }

      - name: home
        label: "Home: hero"
        file: content/{{locale}}/home.json
        i18n: true
        fields:
          - name: eyebrow
            label: Eyebrow
            widget: object
            i18n: true
            fields:
              - { name: muted, label: Muted part, widget: string, maxlength: 40, i18n: true, use_emoji_autocomplete: false }
              - { name: strong, label: Strong part, widget: string, maxlength: 40, i18n: true, use_emoji_autocomplete: false }
          - name: headline
            label: Headline
            widget: object
            i18n: true
            fields:
              - { name: lead, label: Lead, widget: string, maxlength: 30, i18n: true, use_emoji_autocomplete: false }
              - name: verbs
                label: Verbs (three short words or phrases)
                widget: list
                i18n: true
                min: 3
                max: 3
                field: { name: verb, label: Verb, widget: string, maxlength: 12, i18n: true, use_emoji_autocomplete: false }
              - { name: tail, label: Tail, widget: string, maxlength: 32, i18n: true, use_emoji_autocomplete: false }
          - name: pitch
            label: Pitch
            widget: object
            i18n: true
            fields:
              - { name: title, label: Title, widget: string, maxlength: 40, i18n: true, use_emoji_autocomplete: false }
              - { name: text, label: Text (one line), widget: string, maxlength: 48, i18n: true, use_emoji_autocomplete: false }
          - &link_cta
            name: cta
            label: Button
            widget: object
            i18n: true
            fields:
              - &link_label { name: label, label: Label, widget: string, maxlength: 30, i18n: true, use_emoji_autocomplete: false }
              - &link_href { name: href, label: Link, widget: string, maxlength: 200, i18n: duplicate, hint: "A site path such as /contact/ or /#faq, or a full https:// address.", pattern: ['^(?:\/(?!\/)[\w.~/#?=&%-]*|https:\/\/[^\s"<>]+)$', "Use a site path such as /contact/ or a full https:// address"], use_emoji_autocomplete: false }
          - name: stats
            label: Stats
            hint: The first counts the services, the second counts the engagements and names them.
            widget: list
            i18n: true
            min: 2
            max: 2
            fields:
              - { name: value, label: Value, widget: string, maxlength: 4, i18n: true, use_emoji_autocomplete: false }
              - { name: unit, label: Unit, widget: string, maxlength: 4, i18n: true, required: false, use_emoji_autocomplete: false }
              - { name: label, label: Label, widget: string, maxlength: 24, i18n: true, use_emoji_autocomplete: false }
              - { name: sub, label: Sub-label, widget: string, maxlength: 40, i18n: true, use_emoji_autocomplete: false }
          - name: corner
            label: Featured corner link
            widget: object
            i18n: true
            fields:
              - { name: title, label: Title, widget: string, maxlength: 40, i18n: true, use_emoji_autocomplete: false }
              - { name: sub, label: Sub-label, widget: string, maxlength: 30, i18n: true, use_emoji_autocomplete: false }
              - *link_href
          - { name: scrollHint, label: Scroll hint, widget: string, maxlength: 30, i18n: true, use_emoji_autocomplete: false }
          - { name: statement, label: Statement, widget: text, maxlength: 120, i18n: true, use_emoji_autocomplete: false }

      - name: sections
        label: Section headers
        file: content/{{locale}}/sections.json
        i18n: true
        fields:
          - name: work
            label: What We Do
            widget: object
            i18n: true
            fields: &section_fields
              - { name: title, label: Title, widget: string, maxlength: 30, i18n: true, use_emoji_autocomplete: false }
              - { name: index, label: Index, widget: string, maxlength: 3, i18n: duplicate, pattern: ['^\d{3}$', "Use three digits, such as 004"], use_emoji_autocomplete: false }
              - { name: heading, label: Heading, widget: text, maxlength: 140, i18n: true, use_emoji_autocomplete: false }
              - { name: description, label: Description, widget: text, maxlength: 160, i18n: true, use_emoji_autocomplete: false }
          - { name: services, label: Our Services, widget: object, i18n: true, fields: *section_fields }
          - { name: process, label: Our Process, widget: object, i18n: true, fields: *section_fields }
          - { name: analytics, label: What We Measure, widget: object, i18n: true, fields: *section_fields, hint: "The description must keep saying the figures are illustrative, not client results." }
          - { name: pricing, label: Engagements, widget: object, i18n: true, fields: *section_fields }
          - { name: faq, label: Questions & Answers, widget: object, i18n: true, fields: *section_fields }
          - { name: team, label: Who You Work With, widget: object, i18n: true, fields: *section_fields }
          - { name: testimonials, label: What Our Clients Say, widget: object, i18n: true, fields: *section_fields }
          - { name: labs, label: Spacegear Labs, widget: object, i18n: true, fields: *section_fields }

      - name: work
        label: "Home: What We Do"
        file: content/{{locale}}/work.json
        i18n: true
        fields:
          - name: featured
            label: Featured service tile
            hint: Its image comes from the service entry.
            widget: object
            i18n: true
            fields:
              - { name: label, label: Label, widget: string, maxlength: 30, i18n: true, use_emoji_autocomplete: false }
              - { name: name, label: Name, widget: string, maxlength: 30, i18n: true, use_emoji_autocomplete: false }
              - &service_slug { name: slug, label: Service, widget: select, i18n: duplicate, options: [digital-transformation, ai-strategy, applied-ai, automation-integration, product-delivery] }
          - name: lineup
            label: Service lineup card
            widget: object
            i18n: true
            fields:
              - { name: label, label: Label, widget: string, maxlength: 30, i18n: true, use_emoji_autocomplete: false }
              - &count { name: count, label: Count, widget: string, maxlength: 7, i18n: duplicate, hint: "Must match the number of services, such as 5/5.", pattern: ['^\d+\/\d+$', "Use a count such as 5/5"], use_emoji_autocomplete: false }
              - { name: title, label: Title, widget: string, maxlength: 60, i18n: true, use_emoji_autocomplete: false }
              - { name: text, label: Text, widget: text, maxlength: 200, i18n: true, use_emoji_autocomplete: false }
              - { name: footer, label: Footer, widget: string, maxlength: 40, i18n: true, use_emoji_autocomplete: false }
          - name: tiles
            label: Service tiles
            hint: Four tiles. Images and links come from the service entries.
            widget: list
            i18n: true
            min: 4
            max: 4
            summary: "{{fields.name}}"
            fields:
              - *service_slug
              - { name: name, label: Name, widget: string, maxlength: 30, i18n: true, use_emoji_autocomplete: false }
              - { name: desc, label: Description, widget: text, maxlength: 120, i18n: true, use_emoji_autocomplete: false }
          - name: assessment
            label: Assessment card
            widget: object
            i18n: true
            fields:
              - { name: title, label: Title, widget: string, maxlength: 40, i18n: true, use_emoji_autocomplete: false }
              - { name: badge, label: Badge, widget: string, maxlength: 7, i18n: duplicate, hint: "01 over the number of engagements, such as 01/03.", pattern: ['^\d+\/\d+$', "Use a count such as 5/5"], use_emoji_autocomplete: false }
              - { name: note, label: Note, widget: string, maxlength: 60, i18n: true, use_emoji_autocomplete: false }
              - { name: chip, label: Chip, widget: string, maxlength: 30, i18n: true, use_emoji_autocomplete: false }
              - { name: value, label: Value, widget: string, maxlength: 4, i18n: true, use_emoji_autocomplete: false }
              - { name: unit, label: Unit, widget: string, maxlength: 6, i18n: true, use_emoji_autocomplete: false }
              - { name: progress, label: Progress (%), widget: number, i18n: duplicate, value_type: float, min: 0, max: 100 }
              - { name: cta, label: Button label, widget: string, maxlength: 40, i18n: true, use_emoji_autocomplete: false }
              - *link_href

      - name: services-panel
        label: "Home: Our Services panel"
        file: content/{{locale}}/services-panel.json
        i18n: true
        fields:
          - name: panel
            label: Core services card
            widget: object
            i18n: true
            fields:
              - { name: label, label: Label, widget: string, maxlength: 30, i18n: true, use_emoji_autocomplete: false }
              - *count
              - { name: title, label: Title, widget: string, maxlength: 80, i18n: true, use_emoji_autocomplete: false }
              - { name: text, label: Text, widget: text, maxlength: 200, i18n: true, use_emoji_autocomplete: false }
              - { name: line, label: Closing line, widget: string, maxlength: 60, i18n: true, use_emoji_autocomplete: false }
              - { name: cta, label: Button label, widget: string, maxlength: 40, i18n: true, use_emoji_autocomplete: false }
              - *link_href
          - name: pillars
            label: Service pillars
            hint: One per service. Image and description come from the service entry.
            widget: list
            i18n: true
            min: 1
            max: 12
            summary: "{{fields.no}} {{fields.name}}"
            fields:
              - { name: no, label: Number, widget: string, maxlength: 2, i18n: duplicate, pattern: ['^\d{2}$', "Use two digits, such as 03"], use_emoji_autocomplete: false }
              - *service_slug
              - { name: name, label: Name, widget: string, maxlength: 30, i18n: true, use_emoji_autocomplete: false }
              - { name: tag, label: Tag, widget: string, maxlength: 20, i18n: true, use_emoji_autocomplete: false }
              - { name: glyph, label: Glyph, widget: string, maxlength: 2, i18n: true, use_emoji_autocomplete: false }

      - name: process
        label: "Home: Our Process"
        file: content/{{locale}}/process.json
        i18n: true
        fields:
          - &process_steps
            name: steps
            label: Steps
            hint: Each step lists real outputs, never timings.
            widget: list
            i18n: true
            min: 1
            max: 8
            summary: "{{fields.step}}: {{fields.name}}"
            fields:
              - { name: step, label: Step label, widget: string, maxlength: 12, i18n: true, use_emoji_autocomplete: false }
              - { name: name, label: Name, widget: string, maxlength: 20, i18n: true, use_emoji_autocomplete: false }
              - { name: desc, label: Description, widget: text, maxlength: 220, i18n: true, use_emoji_autocomplete: false }
              - name: outputs
                label: Outputs
                widget: list
                i18n: true
                min: 1
                max: 6
                field: { name: output, label: Output, widget: string, maxlength: 40, i18n: true, use_emoji_autocomplete: false }
          - name: cta
            label: Call to action
            widget: object
            i18n: true
            fields:
              - { name: title, label: Title, widget: string, maxlength: 80, i18n: true, use_emoji_autocomplete: false }
              - { name: text, label: Text, widget: text, maxlength: 120, i18n: true, use_emoji_autocomplete: false }
              - { name: cta, label: Button label, widget: string, maxlength: 30, i18n: true, use_emoji_autocomplete: false }
              - *link_href

      - name: approach
        label: "Page: Approach"
        file: content/{{locale}}/approach.json
        i18n: true
        fields:
          - *process_steps

      - name: measure
        label: "Home: What We Measure"
        file: content/{{locale}}/measure.json
        i18n: true
        fields:
          - { name: illustrative, widget: hidden, i18n: duplicate, default: true }
          - name: imageCard
            label: Image card
            hint: This dashboard is an illustrative example. Every card must keep saying illustrative, example or sample.
            widget: object
            i18n: true
            fields:
              - &image_field { name: img, label: Image, widget: image, i18n: duplicate, choose_url: true, hint: "Upload a new image, pick one under Site images, or type a path such as /images/suite/neural-net.webp.", pattern: ['^(?!\/uploads\/.*\.svg$)(?!\/(?:images|uploads)\/(?:[a-z0-9_-]+\/)*(?:con|prn|aux|nul|com\d|lpt\d)[./])\/(?:images|uploads)\/(?:[a-z0-9_-]+\/)*[a-z0-9_-]+\.(?:webp|png|jpe?g|avif|gif|svg)$', "Use a lowercase file name (letters, digits, - or _) ending in .webp, .png, .jpg, .jpeg, .avif or .gif under /images/ or /uploads/ (.svg only under /images/), not a Windows device name such as con or nul"] }
              - { name: accent, label: Accent, widget: string, maxlength: 20, i18n: true, use_emoji_autocomplete: false }
              - { name: label, label: Label, widget: string, maxlength: 20, i18n: true, use_emoji_autocomplete: false }
          - name: workflow
            label: Workflow card
            widget: object
            i18n: true
            fields:
              - { name: title, label: Title, widget: string, maxlength: 30, i18n: true, use_emoji_autocomplete: false }
              - { name: sub, label: Sub-title, widget: string, maxlength: 40, i18n: true, hint: "Keep the word illustrative, example or sample.", use_emoji_autocomplete: false }
              - { name: center, label: Centre value, widget: string, maxlength: 6, i18n: true, use_emoji_autocomplete: false }
              - name: segments
                label: Segments
                widget: list
                i18n: true
                min: 1
                max: 6
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: Label, widget: string, maxlength: 24, i18n: true, use_emoji_autocomplete: false }
                  - { name: value, label: Value (%), widget: number, i18n: duplicate, value_type: float, min: 0, max: 100 }
                  - { name: color, label: Colour, widget: string, maxlength: 7, i18n: duplicate, pattern: ['^#[0-9a-fA-F]{6}$', "Use a hex colour such as #fa6e43"], use_emoji_autocomplete: false }
          - name: stages
            label: Stages
            widget: list
            i18n: true
            min: 1
            max: 6
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: Name, widget: string, maxlength: 20, i18n: true, use_emoji_autocomplete: false }
              - { name: note, label: Note, widget: string, maxlength: 12, i18n: true, use_emoji_autocomplete: false }
              - { name: status, label: Status, widget: string, maxlength: 16, i18n: true, use_emoji_autocomplete: false }
              - { name: detail, label: Detail, widget: string, maxlength: 24, i18n: true, use_emoji_autocomplete: false }
              - name: hands
                label: Dial hands (degrees)
                widget: list
                i18n: duplicate
                min: 2
                max: 2
                field: { name: angle, label: Angle, widget: number, i18n: duplicate, value_type: float, min: 0, max: 360 }
          - { name: stagesFooter, label: Stages footer, widget: string, maxlength: 40, i18n: true, hint: "Keep the word illustrative.", use_emoji_autocomplete: false }
          - name: accuracy
            label: Accuracy card
            widget: object
            i18n: true
            fields:
              - { name: label, label: Label, widget: string, maxlength: 30, i18n: true, use_emoji_autocomplete: false }
              - { name: value, label: Value, widget: string, maxlength: 6, i18n: true, use_emoji_autocomplete: false }
              - { name: unit, label: Unit, widget: string, maxlength: 3, i18n: true, required: false, use_emoji_autocomplete: false }
              - { name: sub, label: Sub-label, widget: string, maxlength: 24, i18n: true, hint: "Keep the word example.", use_emoji_autocomplete: false }
          - name: throughput
            label: Throughput card
            widget: object
            i18n: true
            fields:
              - { name: title, label: Title, widget: string, maxlength: 24, i18n: true, use_emoji_autocomplete: false }
              - { name: sub, label: Sub-title, widget: string, maxlength: 40, i18n: true, hint: "Keep the word example.", use_emoji_autocomplete: false }
              - name: legend
                label: Legend
                widget: list
                i18n: true
                min: 1
                max: 4
                fields:
                  - { name: value, label: Value, widget: string, maxlength: 8, i18n: true, use_emoji_autocomplete: false }
                  - { name: label, label: Label, widget: string, maxlength: 16, i18n: true, use_emoji_autocomplete: false }
          - name: readiness
            label: Readiness card
            widget: object
            i18n: true
            fields:
              - { name: title, label: Title, widget: string, maxlength: 30, i18n: true, use_emoji_autocomplete: false }
              - { name: sub, label: Sub-title, widget: string, maxlength: 50, i18n: true, hint: "Keep the word example.", use_emoji_autocomplete: false }
              - { name: score, label: Score, widget: string, maxlength: 4, i18n: true, use_emoji_autocomplete: false }
              - { name: scoreLabel, label: Score label, widget: string, maxlength: 24, i18n: true, use_emoji_autocomplete: false }
              - name: bars
                label: Bars
                widget: list
                i18n: true
                min: 1
                max: 8
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: Label, widget: string, maxlength: 16, i18n: true, use_emoji_autocomplete: false }
                  - { name: v, label: Value (%), widget: number, i18n: duplicate, value_type: float, min: 0, max: 100 }
          - name: coverage
            label: Coverage card
            widget: object
            i18n: true
            fields:
              - { name: tag, label: Tag, widget: string, maxlength: 30, i18n: true, hint: "Keep the word example.", use_emoji_autocomplete: false }
              - { name: value, label: Value, widget: string, maxlength: 8, i18n: true, use_emoji_autocomplete: false }
              - { name: label, label: Label, widget: string, maxlength: 30, i18n: true, use_emoji_autocomplete: false }
              - { name: progress, label: Progress (%), widget: number, i18n: duplicate, value_type: float, min: 0, max: 100 }
          - name: connectors
            label: Connectors card
            widget: object
            i18n: true
            fields:
              - { name: tag, label: Tag, widget: string, maxlength: 30, i18n: true, use_emoji_autocomplete: false }
              - name: glyphs
                label: Glyphs
                widget: list
                i18n: true
                min: 1
                max: 8
                field: { name: glyph, label: Glyph, widget: string, maxlength: 2, i18n: true, use_emoji_autocomplete: false }
          - name: ticker
            label: Ticker
            widget: list
            i18n: true
            min: 1
            max: 16
            field: { name: item, label: Item, widget: string, maxlength: 40, i18n: true, use_emoji_autocomplete: false }
          - *link_cta

      - name: engagements-panel
        label: "Home: Engagements footer"
        file: content/{{locale}}/engagements-panel.json
        i18n: true
        fields:
          - name: footer
            label: Footer link
            widget: object
            i18n: true
